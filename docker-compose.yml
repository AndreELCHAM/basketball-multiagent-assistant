services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [./qdrant_data:/qdrant/storage]
    networks: [rag-net]

  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    networks: [backend-net]

  system-a:
    build: .
    ports: ["8000:8000"]
    depends_on: [qdrant, mongodb, mcp-rules-lookup, mcp-foul-calculator]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      MONGODB_URL: mongodb://mongodb:27017
      SYSTEM_B_URL: http://system-b:8001
      MCP_RULES_URL: http://mcp-rules-lookup:5001
      MCP_FOUL_URL: http://mcp-foul-calculator:5002
      EMBEDDING_DEVICE: cpu
    volumes: [./data:/app/data]
    networks: [frontend-net, rag-net, backend-net] 

  system-b:
    build: ./system_b
    ports: ["8001:8001"]
    depends_on: [mongodb, mcp-rules-lookup, mcp-foul-calculator]
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MCP_RULES_URL: http://mcp-rules-lookup:5001
      MCP_FOUL_URL: http://mcp-foul-calculator:5002
    networks: [backend-net]  

  mcp-rules-lookup:
    build: ./mcp_servers/rules_lookup
    ports: ["5001:5001"]
    networks: [backend-net]

  mcp-foul-calculator:
    build: ./mcp_servers/foul_calculator
    ports: ["5002:5002"]
    networks: [backend-net]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [system-a]
    networks: [frontend-net]  

networks:
  frontend-net:
    driver: bridge
  rag-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  mongo_data:
